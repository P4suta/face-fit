# Credential delivery follows docs/credential-delivery.md.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: >-
      github.repository_id == '1285246258' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please
    permissions:
      contents: read  # The App token authorizes release proposals.
    env:
      HAS_APP: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' ||
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' }}
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_PLEASE_CLIENT_ID, '${') &&
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_PLEASE_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.HAS_APP == 'true' && env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - name: Mint GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: face-fit
          permission-contents: write
          permission-pull-requests: write

      - name: release-please
        if: env.HAS_APP == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dormant notice (App not configured)
        if: env.HAS_APP != 'true'
        run: |
          echo "::notice::release-please is dormant — set RELEASE_PLEASE_CLIENT_ID and"
          echo "RELEASE_PLEASE_PRIVATE_KEY in the release-please environment to activate."
