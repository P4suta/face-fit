# OpenSSF Scorecard: weekly supply-chain posture scan (pinned dependencies,
# token permissions, branch protection, SAST coverage, dangerous-workflow
# patterns, ...). Findings surface under Security > Code scanning; publish_results
# feeds the public Scorecard API that backs the README badge. Public repo only.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1" # Mondays, offset from the other weekly jobs (codeql/osv)
  push:
    branches: [main]

# Least privilege at the top; the job below grants only what Scorecard needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the public Scorecard API (badge)
      contents: read
      actions: read # read workflow files for the token / pinned-deps checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Scorecard recommendation (no creds in checkout)

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
