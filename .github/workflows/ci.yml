name: CI

on:
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more request it themselves.
permissions:
  contents: read

jobs:
  # Cheap ubuntu hygiene tier — no deps, fast fail signal.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lint the workflow YAML itself (syntax, ${{ }} expression types, shellcheck).
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      # Spell-check code + docs (reads _typos.toml).
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          version: "0.10.0"
      # fmt --check enforces TOML *formatting* (taplo.toml), not just validity.
      - run: taplo fmt --check
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !site
            !htmlcov
            !.venv
            !.nox
            !**/CHANGELOG.md

  # Python lint + type check.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: yamllint
        run: uv run yamllint .

  # Conventional-Commits PR title (authoritative gate for squash-merges).
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read  # Read the pull request title.
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Defence in depth: a release-please Release PR (labelled "autorelease: pending")
  # cannot merge until a human adds "release: approved" — cutting a release is an
  # explicit act, not an accidental merge. Every non-release PR passes.
  release-gate:
    name: release-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read  # Read the release approval labels.
    steps:
      - name: Require an explicit approval label on a Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "autorelease: pending"; then
            if echo "$labels" | grep -qx "release: approved"; then
              echo "Release PR carries 'release: approved' — gate open."
            else
              echo "::error::This is a release PR. Add the 'release: approved' label to allow merge."
              exit 1
            fi
          else
            echo "Not a release PR — gate passes."
          fi

  # Unit tests across every supported Python.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest

  # Single required status check for branch protection: green only when every
  # gating job (hygiene, quality, the whole test matrix) succeeded. Skipped
  # PR-only jobs (pr-title, release-gate) are intentionally not gated here.
  ci-required:
    name: ci-required
    if: always()
    needs: [hygiene, quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if echo "${RESULTS}" | grep -qE 'failure|cancelled'; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
          echo "all required jobs passed"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [hygiene, quality, pr-title, release-gate, test, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
