---
# The one status check branch protection requires, identical in every P4suta repository.
# It waits until every other check on the pull request's head commit has finished,
# then fails if any of them failed, so the ruleset never has to list a repository's own job names.
name: required

on:
  pull_request:

permissions:
  checks: read
  statuses: read

concurrency:
  group: required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Wait for every other check, then fail if any failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Checks start within seconds of the pull request event; the first pause lets them register.
          sleep 45
          previous=""
          while :; do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | select(.name != "required") | "\(.name)\t\(.status)\t\(.conclusion // "")"' | sort)
            statuses=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100" \
              --jq '.statuses[] | "\(.context)\t\(.state)"' | sort)
            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed"' | wc -l)
            pending=$((pending + $(printf '%s\n' "$statuses" | awk -F'\t' 'NF && $2 == "pending"' | wc -l)))
            snapshot="$runs"$'\n'"$statuses"
            if [ "$pending" -eq 0 ] && [ "$snapshot" = "$previous" ]; then
              break
            fi
            previous=$([ "$pending" -eq 0 ] && printf '%s' "$snapshot" || true)
            echo "waiting: $pending check(s) still running"
            sleep 30
          done
          failed=$(
            printf '%s\n' "$runs" | awk -F'\t' 'NF && $3 !~ /^(success|neutral|skipped)$/ {print $1 " (" $3 ")"}'
            printf '%s\n' "$statuses" | awk -F'\t' 'NF && $2 != "success" {print $1 " (" $2 ")"}'
          )
          echo "checks seen:"
          printf '%s\n' "$runs" | awk -F'\t' 'NF {print "  " $1 ": " $3}'
          printf '%s\n' "$statuses" | awk -F'\t' 'NF {print "  " $1 ": " $2}'
          if [ -n "$failed" ]; then
            echo "::error::failed checks:"
            printf '  %s\n' "$failed"
            exit 1
          fi
