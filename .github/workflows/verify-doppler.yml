---
name: Verify credential access

'on':
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-credentials
  cancel-in-progress: false

jobs:
  automation_0:
    name: Verify automation access
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1285246258'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release-please
    permissions: {}
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_PLEASE_CLIENT_ID, '${') &&
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_PLEASE_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - name: Verify a read-only repository token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
