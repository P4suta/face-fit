# Static analysis for the Python source and the GitHub Actions workflows.
#
# Two independent analyses, both build-mode none (Python is interpreted; Actions
# needs no build), so each runs on cheap ubuntu:
#   - python  — semantic CodeQL queries over src/ and tests/.
#   - actions — re-checks workflow GITHUB_TOKEN permissions and untrusted-input
#     patterns so the missing-permissions class can't silently regress.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

# Least privilege: read-only at the top level; the job requests the
# security-events write it needs to upload SARIF.
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload CodeQL SARIF results
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
